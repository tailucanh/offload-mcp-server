<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<text x="480" y="25" fill="#8b949e" text-anchor="middle" style="font-size:14px">Claude Code  ·  offload-mcp-server  ·  Antigravity CLI</text>
<text class="l0" x="28" y="78" fill="#e6edf3" >&gt; Inventory every HTTP endpoint under api/v1: URL, methods, auth, main class.</text>
<text class="l1" x="28" y="108" fill="#a371f7" >● offload_submit_task</text>
<text class="l2" x="56" y="138" fill="#8b949e" >task · 4 steps · output_hint · done_when · paths: ["api/v1"]</text>
<text class="l3" x="56" y="168" fill="#8b949e" >Job 20261108-4f2a9c queued on backend agy</text>
<text class="l4" x="28" y="198" fill="#8b949e" font-style="italic">  Claude keeps working. In the background, the Antigravity CLI reads:</text>
<text class="l5" x="56" y="228" fill="#58a6ff" >agy ▸ offload-reader · 37 files in scope (140 KB)</text>
<text class="l6" x="28" y="288" fill="#a371f7" >● offload_get_status  wait_sec=50</text>
<text class="l7" x="56" y="318" fill="#3fb950" >succeeded · 503 s · worker used 192,000 tokens (Google quota)</text>
<text class="l8" x="56" y="348" fill="#3fb950" >Brief check: all 4 step(s) reported done.</text>
<text class="l9" x="56" y="378" fill="#e6edf3" >## Summary  ~2,000 characters, with path:line evidence</text>
<text class="l10" x="28" y="408" fill="#d29922" >● Spot-check 6 cited path:line → 6 of 6 match</text>
<text class="l11" x="28" y="438" fill="#f0883e" font-weight="700">  Claude read ≈ 0.5k tokens instead of ≈ 40k.</text>
<rect class="track" x="56" y="244" width="420" height="10" rx="5" fill="#21262d"/>
<rect class="bar" x="56" y="244" width="0" height="10" rx="5" fill="#58a6ff"/>
<text class="clock" x="492" y="254" fill="#8b949e">reading files, one tool call at a time…</text>
<text x="28" y="496" fill="#6e7681" style="font-size:12px">Illustration. Times, token counts and the spot check come from the measured run (README › Measured results).</text>
