name: Bug report
description: Something does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please run `node dist/index.js doctor` first; its output answers most setup questions.
        For a security problem, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Job status or error
      description: The `offload_get_status` output, or the error text. For a failed job, add `offload_get_result` with `part: "stderr"`.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `node dist/index.js doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: offload-mcp-server version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: worker
    attributes:
      label: Worker CLI and version
      placeholder: agy 1.5.3
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.1.319
